<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ff">
<meta name="description" content="Wybierz wzór, przygotuj kredki i odrysuj piksele w zeszycie w kratkę.">
<title>Pikseluj — Piksele do rysowania w zeszycie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235742bb'/%3E%3Cpath fill='%23fff' d='M8 8h7v7H8zm9 9h7v7h-7z'/%3E%3Cpath fill='%23ffcb70' d='M17 8h7v7h-7z'/%3E%3Cpath fill='%23f3a9c5' d='M8 17h7v7H8z'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg:#f7f5ff; --ink:#272145; --muted:#5c5577; --violet:#5742bb;
  --deep:#452f9d; --line:#e4dff3; --cream:#fffdf6;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing:border-box }
[hidden] { display:none !important }
html { background:var(--bg) }
body { margin:0; color:var(--ink); min-width:0; line-height:1.5 }
button, a { -webkit-tap-highlight-color:transparent }
a { color:inherit }
button { font:inherit; color:inherit; cursor:pointer }
:focus-visible { outline:3px solid var(--violet); outline-offset:4px }
svg { display:block }
.wrap { width:min(1080px, 100% - 40px); margin-inline:auto }
.site-header { border-bottom:1px solid var(--line); background:#fbfaff }
.topbar { display:flex; align-items:center; justify-content:space-between; min-height:68px; gap:16px }
.brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; font-size:1.47rem; font-weight:900; letter-spacing:-.065em }
.brand-mark { display:grid; grid-template-columns:repeat(2,6px); gap:2px; align-content:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--violet); box-shadow:0 2px 0 var(--deep) }
.brand-mark i { width:6px; height:6px; background:#fff; border-radius:1px }
.brand-mark i:nth-child(2) { background:#ffcb70 }
.brand-mark i:nth-child(3) { background:#f3a9c5 }
.topnote { display:inline-flex; align-items:center; gap:7px; color:var(--deep); background:#eee9ff; border:1px solid #e8e0ff; padding:5px 10px; border-radius:50px; font-size:.75rem; font-weight:780; white-space:nowrap }
.topnote svg { width:14px; height:14px }
.hero { isolation:isolate; position:relative; display:grid; grid-template-columns:1fr .72fr; align-items:center; min-height:305px; margin-block:30px 34px; border-radius:30px; border:1px solid #dcd2f5; overflow:hidden; background-color:#eae3ff; background-image:linear-gradient(#ffffff59 1px, transparent 1px),linear-gradient(90deg,#ffffff59 1px, transparent 1px); background-size:21px 21px }
.hero::before { content:""; z-index:-1; position:absolute; inset:0; background:linear-gradient(90deg,#efe9ff 8%,#efe9ffbd 40%,transparent 81%); pointer-events:none }
.hero-copy { position:relative; z-index:1; padding:34px 0 34px 42px }
.hero-kicker, .section-kicker { text-transform:uppercase; font-size:.69rem; font-weight:850; letter-spacing:.14em; color:var(--deep) }
.hero-kicker { display:inline-flex; align-items:center; gap:8px; background:#faf7ff; border:1px solid #ded4f6; border-radius:50px; padding:5px 10px }
.hero-kicker::before { content:""; display:block; width:7px; height:7px; background:#9971e3; box-shadow:2px 2px #decbff }
h1, h2, h3, p { margin:0 }
.hero h1 { font-size:clamp(2.28rem,5.4vw,4.15rem); line-height:1.02; letter-spacing:-.071em; font-weight:900; margin:12px 0 }
.hero p { color:#4f466f; font-size:clamp(.95rem,1.6vw,1.07rem); max-width:320px }
.hero-art { position:relative; display:grid; place-items:center; height:100%; min-width:0 }
.sticker { width:clamp(144px,24vw,233px); aspect-ratio:1 / 1; display:grid; place-items:center; background:var(--cream); border:2px solid #423468; border-radius:15px; transform:rotate(9deg); box-shadow:6px 8px 0 #b6a3df; position:relative }
.sticker::before, .sticker::after { content:""; position:absolute; width:37%; height:12%; background:#ffce83; border-radius:2px; transform:rotate(-28deg) }
.sticker::before { top:-3%; left:-7% }
.sticker::after { bottom:-4%; right:-6% }
.sticker-paper { display:grid; place-items:center; width:85%; height:85%; background-image:linear-gradient(#e9e3f4 1px,transparent 1px),linear-gradient(90deg,#e9e3f4 1px,transparent 1px); background-size:10px 10px; border:1px solid #efe8f7 }
.sticker-paper svg { width:88%; height:88% }
.spark { position:absolute; width:21px; aspect-ratio:1; background:#f9bc5a; clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%) }
.spark.one { top:22%; right:13% }
.spark.two { bottom:22%; left:11%; background:#a16de0; transform:scale(.72) }
.section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:15px }
.section-kicker { display:block; margin-bottom:2px }
.section-head h2 { font-size:clamp(1.65rem,3.7vw,2.3rem); line-height:1.1; font-weight:900; letter-spacing:-.055em }
.count { font-size:.79rem; color:var(--muted); font-weight:720; white-space:nowrap; padding-bottom:2px }
.cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px }
.card { display:block; min-width:0; padding:9px; text-decoration:none; border:1px solid var(--line); border-radius:19px; background:#fff; box-shadow:0 3px 0 #eae5f7; transition:transform .15s, border-color .15s, box-shadow .15s }
.card:active { transform:translateY(2px); box-shadow:0 1px 0 #eae5f7 }
@media (hover:hover) { .card:hover { transform:translateY(-3px); border-color:#bbaaed; box-shadow:0 5px 0 #e4dcf7 } }
.card-art { display:grid; place-items:center; height:145px; border-radius:12px; background-color:var(--card-bg); background-image:linear-gradient(#fff7 1px,transparent 1px),linear-gradient(90deg,#fff7 1px,transparent 1px); background-size:13px 13px; background-position:center }
.card-art svg { width:74%; height:80%; filter:drop-shadow(0 3px 0 #3224471f) }
.card-caption { padding:7px 3px 3px }
.card-caption h3 { font-size:1.05rem; font-weight:850; letter-spacing:-.035em; line-height:1.2 }
.card-meta { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 8px; margin-top:6px }
.size { font-size:.75rem; color:var(--muted); white-space:nowrap }
.mini-colors { display:flex; gap:3px }
.mini-colors i { width:10px; height:10px; border-radius:2px; background:var(--swatch); border:1px solid #2721452e }
.site-footer { margin-top:32px; padding:15px 0 25px; color:var(--muted); font-size:.78rem; text-align:center }
.reader { width:min(540px, 100% - 36px); margin:0 auto; padding:14px 0 0 }
.back { display:inline-flex; gap:7px; align-items:center; min-height:44px; text-decoration:none; font-weight:790; color:var(--deep); font-size:.91rem }
.back svg { width:18px; height:18px }
.reader-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:2px 0 8px }
.reader-head h1 { font-size:clamp(1.8rem,6.8vw,2.65rem); line-height:1.05; font-weight:900; letter-spacing:-.064em }
.reader-head .size { font-size:.84rem }
.instructions { color:var(--muted); font-size:.9rem; margin-bottom:12px }
.board { background:#fff; border:1px solid var(--line); border-radius:18px; padding:8px 8px 10px; box-shadow:0 3px 0 #eae5f7; --label:1.65rem; --grid-line:#ddd9e8 }
.column-guide, .grid-row { display:grid; grid-template-columns:var(--label) repeat(var(--cols),minmax(0,1fr)); width:100% }
.column-guide { min-height:20px; color:var(--muted); font-size:.65rem; align-items:center; text-align:center; user-select:none }
.grid-row { appearance:none; border:none; padding:0; outline-offset:0; touch-action:manipulation; text-align:center; background:transparent; position:relative }
.grid-row:focus-visible { z-index:2; outline:2px dashed #26145a }
.cell { aspect-ratio:1; border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line); background:var(--pixel,#fff) }
.cell.first { border-left:1px solid var(--grid-line) }
.grid-row:first-child .cell { border-top:1px solid var(--grid-line) }
.cell.blank.fifth { border-right-color:#a8a1bb }
.grid-row:nth-child(5n) .cell.blank { border-bottom-color:#a8a1bb }
.row-label { display:grid; place-items:center; line-height:1; font-size:.67rem; color:var(--muted); font-weight:750; border-radius:4px 0 0 4px; align-self:stretch }
.grid-row[aria-pressed="true"] { z-index:1 }
.grid-row[aria-pressed="true"]::after { content:""; position:absolute; pointer-events:none; inset:0; border:2px solid var(--violet); border-radius:4px 0 0 4px }
.grid-row[aria-pressed="true"] .row-label { background:var(--violet); color:#fff; font-weight:900 }
.legend { margin:15px 0 13px }
.legend h2 { font-size:.88rem; font-weight:850; margin-bottom:6px }
.legend ul { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:5px }
.legend li { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:20px; font-size:.76rem; padding:4px 7px }
.legend i { width:12px; height:12px; border-radius:2px; background:var(--swatch); border:1px solid #27214538 }
.dock { position:sticky; bottom:0; z-index:5; background:var(--bg); padding:8px 0 max(8px,env(safe-area-inset-bottom)); box-shadow:0 -6px 16px #f7f5ffec }
.controls { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:15px; padding:6px; box-shadow:0 2px 0 #eae5f7 }
.controls button { border-radius:10px; min-height:44px; min-width:0; border:1px solid #e2daf6; background:#f3eeff; color:var(--deep); font-size:.76rem; font-weight:810; padding:4px 5px }
.controls button:last-child { background:var(--violet); color:#fff; border-color:var(--violet) }
.controls button:disabled { background:#f6f3fb; color:#736c89; border-color:#eee9f5; cursor:default }
.row-status { color:var(--deep); font-size:.84rem; font-weight:880; white-space:nowrap; text-align:center; font-variant-numeric:tabular-nums }
@media (max-width:700px) {
  .wrap { width:calc(100% - 32px) }
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
  .hero { min-height:234px; margin-block:18px 25px; border-radius:22px; grid-template-columns:1fr .67fr }
  .hero-copy { padding:20px 0 20px 18px }
  .hero h1 { font-size:clamp(1.85rem,5.8vw,3.1rem) }
  .hero p { font-size:.86rem }
  .hero-kicker { font-size:.59rem; letter-spacing:.1em }
  .sticker { width:min(75%,170px) }
  .spark.one { top:16%; right:10%; transform:scale(.74) }
  .spark.two { bottom:20%; left:6%; transform:scale(.58) }
  .card-art { height:clamp(94px,30vw,148px) }
  .topbar { min-height:59px }
}
@media (max-width:365px) {
  .wrap { width:calc(100% - 24px) }
  .reader { width:calc(100% - 24px) }
  .hero-copy { padding-left:13px }
  .hero h1 { font-size:1.72rem }
  .hero p { font-size:.81rem }
  .card-meta { gap:4px }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition:none !important } }
</style>
</head>
<body>
<header class="site-header">
  <div class="topbar wrap">
    <a class="brand" href="#galeria" aria-label="Pikseluj — galeria wzorów"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Pikseluj</a>
    <span class="topnote"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 1.8h10v12.4H3zM1 5h4M1 8h4M1 11h4m2-5h4M7 9h4"/></svg>Zeszyt i kredki</span>
  </div>
</header>
<main>
  <div id="gallery" class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <span class="hero-kicker">Zabawa w kratkę</span>
        <h1 id="title" tabindex="-1">Piksele do rysowania w&nbsp;zeszycie</h1>
        <p>Połóż telefon obok zeszytu i&nbsp;rysuj kratka po kratce.</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="spark one"></span><span class="spark two"></span>
        <div class="sticker"><div id="sticker" class="sticker-paper"></div></div>
      </div>
    </section>
    <section aria-labelledby="gallery-heading">
      <div class="section-head">
        <div><span class="section-kicker">Galeria</span><h2 id="gallery-heading">Wybierz piksele</h2></div>
        <span class="count" id="count"></span>
      </div>
      <div id="cards" class="cards"></div>
    </section>
    <footer class="site-footer">Ty rysujesz, Pikseluj pilnuje wiersza.</footer>
  </div>
  <section id="reader" class="reader" aria-labelledby="pattern-title" hidden>
    <a href="#galeria" id="back" class="back"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 6 6 6m-6-6h14"/></svg>Wróć do wzorów</a>
    <div class="reader-head"><h1 id="pattern-title" tabindex="-1"></h1><span id="pattern-size" class="size"></span></div>
    <p class="instructions" id="instructions">Dotknij wiersza, żeby go podświetlić. Białe kratki zostaw puste.</p>
    <div id="board" class="board" role="group" aria-label="Wzór do odrysowania" aria-describedby="instructions">
      <div id="columns" class="column-guide" aria-hidden="true"></div>
      <div id="rows"></div>
    </div>
    <section class="legend" aria-labelledby="legend-title">
      <h2 id="legend-title">Przygotuj kredki</h2><ul id="palette"></ul>
    </section>
    <div class="dock">
      <div class="controls" aria-label="Zmiana wiersza">
        <button id="previous" type="button">Poprzedni</button>
        <output id="row-status" class="row-status" aria-live="polite" aria-atomic="true"></output>
        <button id="next" type="button">Następny</button>
      </div>
    </div>
  </section>
  <noscript><p class="wrap">Żeby wybrać wzór i podświetlać wiersze, włącz JavaScript w przeglądarce.</p></noscript>
</main>
<script>
'use strict';

// Każdy znak to jedna kratka. Kropka oznacza puste pole.
const colors = {
  k: ['#302641','czarny'], o: ['#f6a449','pomarańczowy'],
  p: ['#f58cb1','różowy'], r: ['#e74766','czerwony'],
  y: ['#f5cd53','żółty'], g: ['#5bbb79','zielony'],
  d: ['#2e855e','ciemnozielony'], b: ['#53bfde','błękitny'],
  v: ['#9670e6','fioletowy'], n: ['#98674f','brązowy'],
  c: ['#f7dfac','kremowy'], s: ['#b5a9c6','szary']
};

const patterns = [
  { id:'kotek', name:'Kotek', bg:'#fce6ef', art:`
    ............
    .kk......kk.
    .kok....kok.
    .kpokkkoopk.
    .kooocoookk.
    .kooooooook.
    .kokooookok.
    .kooocooook.
    .kppckccppk.
    ..kccoccok..
    ...kkkkkk...
    ............
  ` },
  { id:'truskawka', name:'Truskawka', bg:'#ffe8e8', art:`
    ...........
    .....d.....
    ..d.dgd.d..
    ...dgggd...
    .rrrgdrrr..
    .rprrrrprr.
    .rrryrrrrr.
    .rprrryrrr.
    ..rrrrrrr..
    ...rryrr...
    ....rrr....
    ...........
  ` },
  { id:'dino', name:'Mały dino', bg:'#e4f5e6', art:`
    ..............
    ........kkkk..
    .......kggggk.
    .......kgkggk.
    .......kggggk.
    ...y..kkgggk..
    ..ydykgggkk...
    .k.gggggkgk...
    .kkgggkgkk....
    ..kkggggk.....
    ...kkggkk.....
    .....kgk......
    .....kkk......
    ..............
  ` },
  { id:'rakieta', name:'Rakieta', bg:'#e9e5ff', art:`
    .............
    ......k......
    .....krk...y.
    ....krrrk....
    ....kccck....
    .y..kbbbk....
    ....kbbbk....
    ....kccck....
    ...rkccckr...
    ..rrkccckrr..
    ..rk.kkk.kr..
    .....oyo.....
    .....ryr.....
    ......o......
    .............
  ` },
  { id:'aksolotl', name:'Aksolotl', bg:'#f9e2fa', art:`
    ................
    .v............v.
    ..v..........v..
    .pv..kkkkkk..vp.
    ..vvkppppppkvv..
    .pvkppppppppkvp.
    ..vkpkppppkpkv..
    ...kppckkcppk...
    ...kkppppppkk...
    .....kkkkkk.....
    .....kpppk..v...
    ....kppppkkppv..
    ....kk..kkkkk...
    ................
  ` },
  { id:'grzybek', name:'Grzybek', bg:'#fff2d7', art:`
    .............
    ....kkkkk....
    ...krrrrrk...
    ..krccrrrrk..
    .krrccrccrrk.
    .krrrrrccrrk.
    .kcrrrrrrrck.
    ..kkkkkkkkk..
    ....kccck....
    ....kcnck....
    ....kcnck....
    ...gkkkkkg...
    .............
  ` },
  { id:'teczowa-chmurka', name:'Tęczowa chmurka', bg:'#e2f3ff', art:`
    .................
    .....rrrrrrr.....
    ...rryyyyyyyrr...
    ..ryygggggggyyr..
    .ryggbbbbbbbggyr.
    .rygbvv...vvbgyr.
    .rygbv.....vbgyr.
    .rygbv.....vbgyr.
    .skss........ss..
    .kccck......sccs.
    kccccck....sccccs
    kckckck....scccs.
    .kccck......sss..
    ..kkk............
    .................
  ` },
  { id:'robot', name:'Robot', bg:'#e1f5f0', art:`
    ...............
    .......y.......
    .......k.......
    ....kkkkkkk....
    ....kbbbbbk....
    ....kbkbkbk....
    ....kbbpbbk....
    ....kkkkkkk....
    ..kkkkkkkkkkk..
    ..ksksysysksk..
    ..ksksssssksk..
    ...kkkkkkkkk...
    .....ks.ks.....
    ....kks.kks....
    ...............
  ` }
].map(({art,...pattern}) => {
  const rows = art.trim().split('\n').map(row => row.trim());
  const width = rows[0].length;
  if (rows.some(row => row.length !== width || [...row].some(cell => cell !== '.' && !Object.hasOwn(colors,cell)))) {
    throw new Error('Niepoprawny wzór: ' + pattern.id);
  }
  const used = Object.keys(colors).filter(color => rows.some(row => row.includes(color)));
  return {...pattern, rows, width, height:rows.length, used};
});

const $ = id => document.getElementById(id);
const el = (name, className, value) => {
  const node = document.createElement(name);
  if (className) node.className = className;
  if (value !== undefined) node.textContent = value;
  return node;
};
const svgNode = name => document.createElementNS('http://www.w3.org/2000/svg',name);

function sprite(pattern) {
  const svg = svgNode('svg');
  svg.setAttribute('viewBox',`0 0 ${pattern.width} ${pattern.height}`);
  svg.setAttribute('shape-rendering','crispEdges');
  svg.setAttribute('aria-hidden','true');
  for (const color of pattern.used) {
    const path = svgNode('path');
    const segments = [];
    pattern.rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] === color) segments.push(`M${x} ${y}h1v1h-1z`);
      }
    });
    path.setAttribute('d',segments.join(''));
    path.setAttribute('fill',colors[color][0]);
    svg.append(path);
  }
  return svg;
}
function swatch(color, withTitle = false) {
  const item = el('i');
  item.style.setProperty('--swatch',colors[color][0]);
  item.setAttribute('aria-hidden','true');
  if (withTitle) item.title = colors[color][1];
  return item;
}
function sizeText(pattern) { return `${pattern.width} × ${pattern.height} kratek`; }
function sizeLabel(pattern) { return `${pattern.width} kratek w poziomie, ${pattern.height} w pionie`; }

$('sticker').append(sprite(patterns[0]));
$('count').textContent = patterns.length + ' wzorów';
for (const pattern of patterns) {
  const card = el('a','card');
  card.href = '#wzor/' + pattern.id;
  const thumb = el('div','card-art');
  thumb.style.setProperty('--card-bg',pattern.bg);
  thumb.append(sprite(pattern));
  const caption = el('div','card-caption');
  const title = el('h3','',pattern.name);
  title.id = 'card-title-' + pattern.id;
  card.setAttribute('aria-labelledby',title.id);
  const meta = el('div','card-meta');
  meta.id = 'card-info-' + pattern.id;
  card.setAttribute('aria-describedby',meta.id);
  const size = el('span','size',sizeText(pattern));
  size.setAttribute('aria-label',sizeLabel(pattern));
  const mini = el('span','mini-colors');
  mini.setAttribute('role','img');
  mini.setAttribute('aria-label','Kolory: ' + pattern.used.map(color => colors[color][1]).join(', '));
  for (const color of pattern.used) mini.append(swatch(color,true));
  meta.append(size,mini);
  caption.append(title,meta);
  card.append(thumb,caption);
  $('cards').append(card);
}

let activePattern = null;
let activeRow = 0;
let rowButtons = [];
let lastGalleryY = 0;
const positions = new Map();
const storageKey = 'pikseluj/wiersz/';
function savedRow(pattern) {
  try {
    const saved = Number(localStorage.getItem(storageKey + pattern.id));
    if (Number.isInteger(saved) && saved >= 0 && saved < pattern.height) return positions.get(pattern.id) ?? saved;
  } catch { /* Galeria działa także bez dostępu do pamięci przeglądarki. */ }
  return positions.get(pattern.id) ?? 0;
}

function showRow(index,{scroll = false, focus = false} = {}) {
  if (!activePattern || !rowButtons[index]) return;
  activeRow = index;
  rowButtons.forEach((button,i) => {
    button.setAttribute('aria-pressed',String(i === index));
    button.tabIndex = i === index ? 0 : -1;
  });
  const previousHadFocus = document.activeElement === $('previous');
  const nextHadFocus = document.activeElement === $('next');
  $('previous').disabled = index === 0;
  $('next').disabled = index === activePattern.height - 1;
  $('row-status').textContent = `Wiersz ${index + 1} z ${activePattern.height}`;
  positions.set(activePattern.id,index);
  try { localStorage.setItem(storageKey + activePattern.id,String(index)); } catch { /* opcjonalny zapis */ }
  if (focus) rowButtons[index].focus({preventScroll:true});
  else if (previousHadFocus && $('previous').disabled) $('next').focus({preventScroll:true});
  else if (nextHadFocus && $('next').disabled) $('previous').focus({preventScroll:true});
  if (scroll) {
    const rowRect = rowButtons[index].getBoundingClientRect();
    const dockTop = document.querySelector('.dock').getBoundingClientRect().top;
    if (rowRect.top < 4 || rowRect.bottom > Math.min(dockTop,innerHeight) - 4) {
      rowButtons[index].scrollIntoView({block:'center'});
    }
  }
}

function openPattern(pattern) {
  activePattern = pattern;
  $('gallery').hidden = true;
  $('reader').hidden = false;
  $('pattern-title').textContent = pattern.name;
  $('pattern-size').textContent = sizeText(pattern);
  $('pattern-size').setAttribute('aria-label',sizeLabel(pattern));
  $('board').style.setProperty('--cols',pattern.width);
  $('columns').replaceChildren(el('span'));
  $('rows').replaceChildren();
  $('palette').replaceChildren();
  for (let x = 1; x <= pattern.width; x++) {
    $('columns').append(el('span','',x === 1 || x % 5 === 0 || x === pattern.width ? String(x) : ''));
  }
  rowButtons = pattern.rows.map((row,y) => {
    const button = el('button','grid-row');
    button.type = 'button';
    button.setAttribute('aria-label',`Wiersz ${y + 1}`);
    const label = el('span','row-label',y + 1);
    label.setAttribute('aria-hidden','true');
    button.append(label);
    [...row].forEach((color,x) => {
      const cell = el('span','cell' + (color === '.' ? ' blank' : '') + (x === 0 ? ' first' : '') + ((x + 1) % 5 === 0 ? ' fifth' : ''));
      cell.setAttribute('aria-hidden','true');
      if (color !== '.') cell.style.setProperty('--pixel',colors[color][0]);
      button.append(cell);
    });
    button.addEventListener('click',() => showRow(y));
    button.addEventListener('keydown',event => {
      const target = {ArrowUp:y - 1, ArrowDown:y + 1, Home:0, End:pattern.height - 1}[event.key];
      if (target === undefined) return;
      event.preventDefault();
      showRow(Math.max(0,Math.min(target,pattern.height - 1)),{focus:true,scroll:true});
    });
    $('rows').append(button);
    return button;
  });
  for (const color of pattern.used) {
    const item = el('li');
    item.append(swatch(color),document.createTextNode(colors[color][1]));
    $('palette').append(item);
  }
  window.scrollTo(0,0);
  showRow(savedRow(pattern));
  $('pattern-title').focus({preventScroll:true});
}
function route() {
  const pattern = patterns.find(item => location.hash === '#wzor/' + item.id);
  if (pattern) {
    if (pattern === activePattern) return;
    if (!activePattern) lastGalleryY = window.scrollY;
    document.title = pattern.name + ' — Pikseluj';
    openPattern(pattern);
    return;
  }
  const old = activePattern;
  activePattern = null;
  document.title = 'Pikseluj — Piksele do rysowania w zeszycie';
  $('reader').hidden = true;
  $('gallery').hidden = false;
  if (old) {
    const card = $('card-title-' + old.id).closest('a');
    window.scrollTo(0,lastGalleryY);
    card.focus({preventScroll:true});
  }
}
for (const id of ['back']) $(id).addEventListener('click',event => {
  if (!history.state?.pikselujFromGallery || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  history.back();
});
$('cards').addEventListener('click',event => {
  const card = event.target.closest('a');
  if (!card || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  history.pushState({pikselujFromGallery:true},'',card.hash);
  route();
});
$('previous').addEventListener('click',() => showRow(activeRow - 1,{scroll:true}));
$('next').addEventListener('click',() => showRow(activeRow + 1,{scroll:true}));
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
